<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pong</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #111;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Courier New', monospace;
      color: #fff;
    }
    h1 {
      font-size: 2rem;
      letter-spacing: 0.5rem;
      margin-bottom: 1rem;
      color: #fff;
    }
    canvas {
      border: 2px solid #fff;
      display: block;
    }
    #info {
      margin-top: 1rem;
      font-size: 0.85rem;
      color: #888;
      text-align: center;
      line-height: 1.8;
    }
    #message {
      position: absolute;
      font-size: 1.2rem;
      color: #ff0;
      letter-spacing: 0.1rem;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <h1>PONG</h1>
  <canvas id="canvas" width="800" height="500"></canvas>
  <div id="info">
    Player 1: W / S &nbsp;|&nbsp; Player 2: ↑ / ↓ &nbsp;|&nbsp; Press SPACE to start / pause
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    const W = canvas.width;
    const H = canvas.height;

    const PADDLE_W = 12;
    const PADDLE_H = 80;
    const BALL_SIZE = 10;
    const PADDLE_SPEED = 6;
    const WINNING_SCORE = 7;

    const state = {
      running: false,
      over: false,
      winner: null,
    };

    const ball = {
      x: W / 2,
      y: H / 2,
      vx: 5,
      vy: 3,
      speed: 5,
    };

    const p1 = { y: H / 2 - PADDLE_H / 2, score: 0, up: false, down: false };
    const p2 = { y: H / 2 - PADDLE_H / 2, score: 0, up: false, down: false };

    const P1_X = 20;
    const P2_X = W - 20 - PADDLE_W;

    function resetBall(direction = 1) {
      ball.x = W / 2;
      ball.y = H / 2;
      ball.speed = 5;
      const angle = (Math.random() * Math.PI / 3) - Math.PI / 6;
      ball.vx = direction * ball.speed * Math.cos(angle);
      ball.vy = ball.speed * Math.sin(angle);
    }

    function movePaddles() {
      if (p1.up)   p1.y = Math.max(0, p1.y - PADDLE_SPEED);
      if (p1.down) p1.y = Math.min(H - PADDLE_H, p1.y + PADDLE_SPEED);
      if (p2.up)   p2.y = Math.max(0, p2.y - PADDLE_SPEED);
      if (p2.down) p2.y = Math.min(H - PADDLE_H, p2.y + PADDLE_SPEED);
    }

    function collidesWithPaddle(bx, by, px, py) {
      return bx + BALL_SIZE > px &&
             bx < px + PADDLE_W &&
             by + BALL_SIZE > py &&
             by < py + PADDLE_H;
    }

    function updateBall() {
      ball.x += ball.vx;
      ball.y += ball.vy;

      // Top / bottom wall bounce
      if (ball.y <= 0) {
        ball.y = 0;
        ball.vy *= -1;
      } else if (ball.y + BALL_SIZE >= H) {
        ball.y = H - BALL_SIZE;
        ball.vy *= -1;
      }

      // Paddle 1 collision
      if (ball.vx < 0 && collidesWithPaddle(ball.x, ball.y, P1_X, p1.y)) {
        ball.x = P1_X + PADDLE_W;
        const hitPos = (ball.y + BALL_SIZE / 2) - (p1.y + PADDLE_H / 2);
        const norm = hitPos / (PADDLE_H / 2);
        const angle = norm * (Math.PI / 3);
        ball.speed = Math.min(ball.speed + 0.3, 14);
        ball.vx = ball.speed * Math.cos(angle);
        ball.vy = ball.speed * Math.sin(angle);
      }

      // Paddle 2 collision
      if (ball.vx > 0 && collidesWithPaddle(ball.x, ball.y, P2_X, p2.y)) {
        ball.x = P2_X - BALL_SIZE;
        const hitPos = (ball.y + BALL_SIZE / 2) - (p2.y + PADDLE_H / 2);
        const norm = hitPos / (PADDLE_H / 2);
        const angle = norm * (Math.PI / 3);
        ball.speed = Math.min(ball.speed + 0.3, 14);
        ball.vx = -(ball.speed * Math.cos(angle));
        ball.vy = ball.speed * Math.sin(angle);
      }

      // Scoring
      if (ball.x + BALL_SIZE < 0) {
        p2.score++;
        checkWin(2);
        resetBall(1);
      } else if (ball.x > W) {
        p1.score++;
        checkWin(1);
        resetBall(-1);
      }
    }

    function checkWin(player) {
      const score = player === 1 ? p1.score : p2.score;
      if (score >= WINNING_SCORE) {
        state.over = true;
        state.running = false;
        state.winner = player;
      }
    }

    // --- Drawing ---

    function drawRect(x, y, w, h, color = '#fff') {
      ctx.fillStyle = color;
      ctx.fillRect(x, y, w, h);
    }

    function drawCenterLine() {
      ctx.setLineDash([10, 10]);
      ctx.strokeStyle = 'rgba(255,255,255,0.3)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(W / 2, 0);
      ctx.lineTo(W / 2, H);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    function drawScores() {
      ctx.fillStyle = 'rgba(255,255,255,0.8)';
      ctx.font = 'bold 48px Courier New';
      ctx.textAlign = 'center';
      ctx.fillText(p1.score, W / 4, 60);
      ctx.fillText(p2.score, 3 * W / 4, 60);
    }

    function drawBall() {
      ctx.fillStyle = '#fff';
      ctx.fillRect(ball.x, ball.y, BALL_SIZE, BALL_SIZE);
    }

    function drawOverlay(text, subtext) {
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#ff0';
      ctx.font = 'bold 36px Courier New';
      ctx.textAlign = 'center';
      ctx.fillText(text, W / 2, H / 2 - 20);
      ctx.fillStyle = '#fff';
      ctx.font = '18px Courier New';
      ctx.fillText(subtext, W / 2, H / 2 + 20);
    }

    function draw() {
      ctx.fillStyle = '#111';
      ctx.fillRect(0, 0, W, H);
      drawCenterLine();
      drawScores();
      drawRect(P1_X, p1.y, PADDLE_W, PADDLE_H);
      drawRect(P2_X, p2.y, PADDLE_W, PADDLE_H);
      drawBall();

      if (state.over) {
        drawOverlay(`PLAYER ${state.winner} WINS!`, 'Press SPACE to play again');
      } else if (!state.running) {
        drawOverlay('PONG', 'Press SPACE to start');
      }
    }

    function gameLoop() {
      if (state.running) {
        movePaddles();
        updateBall();
      }
      draw();
      requestAnimationFrame(gameLoop);
    }

    function restartGame() {
      p1.score = 0;
      p2.score = 0;
      p1.y = H / 2 - PADDLE_H / 2;
      p2.y = H / 2 - PADDLE_H / 2;
      state.over = false;
      state.winner = null;
      resetBall(Math.random() < 0.5 ? 1 : -1);
      state.running = true;
    }

    // --- Input ---

    document.addEventListener('keydown', e => {
      switch (e.key) {
        case 'w': case 'W': p1.up = true; break;
        case 's': case 'S': p1.down = true; break;
        case 'ArrowUp':   e.preventDefault(); p2.up = true; break;
        case 'ArrowDown': e.preventDefault(); p2.down = true; break;
        case ' ':
          e.preventDefault();
          if (state.over) {
            restartGame();
          } else {
            state.running = !state.running;
          }
          break;
      }
    });

    document.addEventListener('keyup', e => {
      switch (e.key) {
        case 'w': case 'W': p1.up = false; break;
        case 's': case 'S': p1.down = false; break;
        case 'ArrowUp':   p2.up = false; break;
        case 'ArrowDown': p2.down = false; break;
      }
    });

    resetBall(1);
    gameLoop();
  </script>
</body>
</html>
